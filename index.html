<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación de Carnets</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .verification-box, .form-box {
            background-color: orange;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .header {
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .message {
            font-size: 18px;
            color: #000;
            margin-bottom: 20px;
        }

        .logo {
            max-width: 200px;
            height: auto;
        }

        input[type="text"] {
            padding: 10px;
            width: 80%;
            margin-bottom: 20px;
            border: none;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Formulario de ingreso -->
    <div class="form-box" id="form-box">
        <div class="header">Verificación de Carnets</div>
        <input type="text" id="documento" placeholder="Ingrese su número de documento">
        <br>
        <button onclick="verificarDocumento()">Verificar</button>
    </div>

    <!-- Resultado de verificación -->
    <div class="verification-box hidden" id="verification-box">
        <div class="header">COLEGIO JUAN FRANCISCO BERBEO</div>
        <div class="message">
            Este carnet ha sido verificado por TVO BERBEO y es original
        </div>
        <img src="logo-tvo-berbeo.png" alt="Logo TVO BERBEO" class="logo">
    </div>
</div>

<script>
    // Lista de documentos válidos proporcionados
    const documentosValidos = [
        "1077999451",
        "1014872886",
        "1019606494",
        "6021381",
        "1028488616",
        "1109665591",
        "1142114049",
        "1050278684",
        "1232404567",
        "4884870"
    ];

    function verificarDocumento() {
        const documentoIngresado = document.getElementById("documento").value.trim();

        if (documentosValidos.includes(documentoIngresado)) {
            document.getElementById("form-box").classList.add("hidden");
            document.getElementById("verification-box").classList.remove("hidden");
        } else {
            alert("Intento de falsificación de carnet");
        }
    }
</script>

</body>
</html>
