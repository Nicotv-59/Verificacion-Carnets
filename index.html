<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificación de Carnets</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .verification-box {
            background-color: orange;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .header {
            font-weight: bold;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .message {
            font-size: 18px;
            color: #000;
            margin-bottom: 20px;
        }

        .logo {
            max-width: 200px;
            height: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="verification-box">
        <div class="header">COLEGIO JUAN FRANCISCO BERBEO</div>
        <div class="message">
            Este carnet ha sido verificado por TVO BERBEO y es original
        </div>
        <img src="logo-tvo-berbeo.png" alt="Logo TVO BERBEO" class="logo">
        <!-- Reemplaza "logo-tvo-berbeo.png" con la ruta real del logo -->
    </div>
</div>

</body>
</html>
